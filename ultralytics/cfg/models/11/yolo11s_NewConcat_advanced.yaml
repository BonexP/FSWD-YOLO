# YOLO11s with NewConcat - Advanced Configuration Example
# 展示 NewConcat 模块的各种参数配置示例
# Demonstrates various parameter configurations for NewConcat module

# Parameters
nc: 6  # number of classes
scales:  # model compound scaling constants
  s: [0.50, 0.50, 1024]

# YOLO11s backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]  # 9
  - [-1, 2, C2PSA, [1024]]  # 10

# YOLO11s head with various NewConcat configurations
head:
  # 配置 1: 标准 NewConcat - 仅指定输出通道（使用所有默认值）
  # Config 1: Standard NewConcat - only output channels (all defaults)
  # out_channels=512, kernel_size=3, use_dw=True, post_fusion=False
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, NewConcat, [512]]  # cat backbone P4
  - [-1, 2, C3k2, [512, False]]  # 13

  # 配置 2: 标准 Concat 用于对比
  # Config 2: Standard Concat for comparison
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256, False]]  # 16 (P3/8-small)

  # 配置 3: NewConcat 禁用深度可分离卷积 - 更强的特征表达
  # Config 3: NewConcat with disabled depthwise conv - stronger features
  # out_channels=512, kernel_size=3, use_dw=False, post_fusion=False
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, NewConcat, [512, 3, True, False]]  # cat head P4
  - [-1, 2, C3k2, [512, False]]  # 19 (P4/16-medium)

  # 配置 4: NewConcat 启用后融合处理 - 复杂融合
  # Config 4: NewConcat with post-fusion - complex fusion
  # out_channels=1024, kernel_size=3, use_dw=True, post_fusion=True
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, NewConcat, [1024, 3, True, True]]  # cat head P5
  - [-1, 2, C3k2, [1024, True]]  # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]  # Detect(P3, P4, P5)

