# YOLO11s + DebiFormer (DBRA) integration
# - Insert DebiFormer at P4 (stride 16) and replace C2PSA at P5 (stride 32)
# - Keep head structure the same, only update layer indices for concatenations

# Parameters
nc: 6  # number of classes
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]                # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]         # 4  (P3 feature for head)

  - [-1, 1, Conv, [512, 3, 2]]                # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                # 6
  # DebiFormer at P4 (kept light: repeats=1, topk=4, n_win=7)
  # DebiFormer args: [c2, shortcut, g, e, k, n_win]
  - [-1, 1, DebiFormer, [512, True, 1, 0.5, 4, 7]]   # 7  (Enhanced P4)

  - [-1, 1, Conv, [1024, 3, 2]]               # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]               # 9
  - [-1, 1, SPPF, [1024, 5]]                  # 10
  # Replace original C2PSA with DebiFormer at P5 (topk slightly smaller)
  - [-1, 1, DebiFormer, [1024, True, 1, 0.5, 3, 7]]  # 11 (Enhanced P5)

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 12
  - [[-1, 7], 1, Concat, [1]]                        # 13 cat backbone P4 (now layer 7)
  - [-1, 2, C3k2, [512, False]]                      # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 15
  - [[-1, 4], 1, Concat, [1]]                        # 16 cat backbone P3 (layer 4)
  - [-1, 2, C3k2, [256, False]]                      # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                       # 18
  - [[-1, 14], 1, Concat, [1]]                       # 19 cat head P4 (layer 14)
  - [-1, 2, C3k2, [512, False]]                      # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                       # 21
  - [[-1, 11], 1, Concat, [1]]                       # 22 cat backbone P5 (now layer 11)
  - [-1, 2, C3k2, [1024, True]]                      # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]]                  # 24 Detect(P3, P4, P5)
