# YOLO11s + DebiFormer (DBRA) integration
# - Replace C2PSA at P5 (stride 32) with DebiFormer
# - Keep head structure the same, only update layer indices for concatenations

# Parameters
nc: 6  # number of classes
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]                # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]         # 4  (P3 feature for head)

  - [-1, 1, Conv, [512, 3, 2]]                # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                # 6  (P4 feature for head)

  - [-1, 1, Conv, [1024, 3, 2]]               # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]               # 8
  - [-1, 1, SPPF, [1024, 5]]                  # 9
  # Replace original C2PSA with DebiFormer at P5 (topk slightly smaller)
  - [-1, 1, DebiFormer, [1024, True, 1, 0.25, 1, 7]]  # 10 (Enhanced P5)

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 11
  - [[-1, 6], 1, Concat, [1]]                        # 12 cat backbone P4 (layer 6)
  - [-1, 2, C3k2, [512, False]]                      # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 14
  - [[-1, 4], 1, Concat, [1]]                        # 15 cat backbone P3 (layer 4)
  - [-1, 2, C3k2, [256, False]]                      # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                       # 17
  - [[-1, 13], 1, Concat, [1]]                       # 18 cat head P4 (layer 13)
  - [-1, 2, C3k2, [512, False]]                      # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                       # 20
  - [[-1, 10], 1, Concat, [1]]                       # 21 cat backbone P5 (layer 10)
  - [-1, 2, C3k2, [1024, True]]                      # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]                  # 23 Detect(P3, P4, P5)

